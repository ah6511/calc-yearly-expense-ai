[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expense-ai"
version = "0.2.0"
description = "AI-powered bank statement transaction extraction, classification, and yearly expense calculation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70.0",
    "boto3>=1.35.0",
    "google-genai>=1.0.0",
    "instructor[anthropic,bedrock,google-genai]>=1.7.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6.2.0",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
analysis = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
]

[project.scripts]
expense-ai = "expense_ai.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/expense_ai"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "handlers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["expense_ai"]
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
